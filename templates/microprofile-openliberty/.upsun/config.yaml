applications:
    app:
        # The runtime the application uses.
        type: "java:11"
        # The hooks executed at various points in the lifecycle of the application.
        hooks:
            build: |
                rm -rf wlpExtract
                mvn clean package
        mounts:
            'server/':
                source: storage
                source_path: server_source
            'wlpExtract/':
                source: storage
                source_path: liberty_source
        # The relationships of the application with services or other applications.
        #
        # The left-hand side is the name of the relationship as it will be exposed
        # to the application in the PLATFORM_RELATIONSHIPS variable. The right-hand
        # side is in the form `<service name>:<endpoint name>`.
        #relationships:
        #    database: "db:mysql"

        # The configuration of app when it is exposed to the web.
        web:
            commands:
                start: |
                    cp target/microprofile-liberty.jar server/microprofile-liberty.jar
                    java -jar -Xmx$(jq .info.limits.memory /run/config.json)m -XX:+ExitOnOutOfMemoryError -Ddefault.http.port=$PORT server/microprofile-liberty.jar
        source:
            root: /files/
services: null
routes: null
